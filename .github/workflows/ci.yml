name: ci

on:
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:
    inputs:
      perl-version:
        description: Perl version to build (defaults to versions.json)
        type: string
        required: false

permissions:
  contents: read

# A full run is all Perl builds with their test suites, so a new push to a
# pull request cancels the run it supersedes. Pushes to main are left to
# finish, so every commit on main keeps a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # -x so the sourced build/common.sh is followed.
          shellcheck -x build/*.sh

      - name: Check PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem build/*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              Write-Host "FAIL - $($_.Name)"
              $errors | ForEach-Object { Write-Host "   $_" }
              $failed = $true
            } else {
              Write-Host "ok   - $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Check the smoke test compiles
        run: perl -c test/smoke.pl

      - name: Check versions.json
        run: |
          python3 - <<'PY'
          import json, re
          v = json.load(open("versions.json"))
          assert v["default"] in v["perl"], "default is not listed under perl"
          specs = dict(v["perl"], cpanm=v["cpanm"])
          for name, spec in specs.items():
              assert re.fullmatch(r"[0-9a-f]{64}", spec["sha256"]), \
                  f"{name}: sha256 is not 64 lowercase hex chars"
              assert spec["url"].startswith("https://"), f"{name}: url is not https"
          assert len(set(v["platforms"])) == len(v["platforms"]), "duplicate platform"
          # catch drift between the release.yml and build.yml
          matrix = open(".github/workflows/build.yml").read()
          for p in v["platforms"]:
              assert re.search(r"- platform: %s$" % re.escape(p), matrix, re.M), \
                  f"{p} is listed in versions.json but missing from build.yml's matrix"
          print(f"{len(v['platforms'])} platforms, default perl {v['default']}")
          PY

  build:
    uses: ./.github/workflows/build.yml
    with:
      perl-version: ${{ inputs.perl-version || '' }}
